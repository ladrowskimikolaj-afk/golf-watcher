name: golf-watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # co 15 minut (GitHub bywa opóźniony o kilka minut)
  workflow_dispatch:          # pozwala uruchomić ręcznie z przeglądarki

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cloudscraper
      - name: Sprawdź ogłoszenia
        env:
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python golf_watcher.py --once
      - name: Zapamiętaj już widziane ogłoszenia
        run: |
          git config user.name "golf-bot"
          git config user.email "golf-bot@users.noreply.github.com"
          git add seen_listings.json || true
          git diff --cached --quiet || (git commit -m "update seen" && git push)
